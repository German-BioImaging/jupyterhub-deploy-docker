events {
    worker_connections 1024;
}

http {
    server {
        listen 443 ssl;

        ssl_certificate    /etc/ssl/tim2025.crt;
        ssl_certificate_key    /etc/ssl/tim2025.key;

        server_name jupyter.tim2025.de;
	client_max_body_size 1000M;

        location / {
            proxy_pass http://proxy:8000; # Assuming 'proxy' is the service name in docker-compose

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;

            # Handling real IP and scheme in proxied server
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }
    }
}
